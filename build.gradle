buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        // Android Gradle Plugin; only used once the :android module is enabled.
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    version = '0.2'
    ext {
        appName = 'framework2d'
        gdxVersion = '1.14.2'
    }

    repositories {
        mavenCentral()
        google()
    }

    // Every source file is UTF-8: the legacy windows-1251 Russian comments were re-encoded.
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
}
